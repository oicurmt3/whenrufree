<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Go to Calendar or Hub - When RU Free</title>
  <style>
    @font-face{
      font-family:'Material Symbols Outlined';
      font-style:normal;font-weight:400;
      src:url('../fonts/material-symbols-outlined.woff2') format('woff2');
    }
    .material-symbols-outlined{
      font-family:'Material Symbols Outlined';
      font-weight:normal;font-style:normal;font-size:24px;line-height:1;
      letter-spacing:normal;text-transform:none;display:inline-block;
      white-space:nowrap;direction:ltr;
      -webkit-font-feature-settings:'liga';font-feature-settings:'liga';
      -webkit-font-smoothing:antialiased;
    }
    *{box-sizing:border-box;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
    html,body{
      margin:0;min-height:10vh;background:#f5f5f5;
      display:flex;align-items:center;justify-content:center;
      padding:16px;color:#333;
    }
    .go-card{
      background:#fff;width:min(440px,100%);
      border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.12);
      padding:32px 28px;text-align:center;
    }
    .go-card h1{
      margin:0 0 6px;font-size:1.3rem;color:#3f51b5;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .go-sub{margin:0 0 16px;color:#666;font-size:0.9rem;line-height:1.4;}
    .type-toggle{display:flex;gap:8px;margin-bottom:16px;}
    .type-btn{
      flex:1;padding:10px;border:2px solid #ccc;background:#fff;
      border-radius:8px;cursor:pointer;font-weight:600;font-size:0.9rem;
    }
    .type-btn.active{border-color:#3f51b5;background:#e8eaf6;color:#283593;}
    .go-input{
      width:100%;padding:14px 16px;font-size:1.1rem;font-weight:700;
      font-family:monospace;letter-spacing:2px;text-align:left;
      border:2px solid #ccc;border-radius:8px;outline:none;
    }
    .go-input:focus{border-color:#3f51b5;box-shadow:0 0 0 3px rgba(63,81,181,0.15);}
    .go-input.error{border-color:#b00020;}
    .go-error{color:#b00020;font-size:0.85rem;margin-top:8px;min-height:1.2em;}
    .go-btn{
      margin-top:16px;width:100%;padding:14px;font-size:1rem;font-weight:700;
      color:#fff;background:#3f51b5;border:none;border-radius:8px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;
    }
    .go-btn:hover{background:#303f9f;}
    .go-footer{margin-top:20px;font-size:0.82rem;color:#999;}
    .go-footer a{color:#666;text-decoration:underline;}
    .go-account{margin-top:12px;display:flex;justify-content:center;}
    .go-account:has(#accountBadge:empty){display:none;}
  </style>
  <link rel="stylesheet" href="../account.css?v=20261009b">
</head>
<body>
  <div class="go-card">
    <h1>
      <span class="material-symbols-outlined" aria-hidden="true">link</span>
      Go to link
    </h1>
    <p class="go-sub">Enter or paste a calendar or Hub code or full link.</p>

    <div class="type-toggle">
      <button type="button" class="type-btn active" data-type="calendar">Calendar</button>
      <button type="button" class="type-btn" data-type="hub">Hub</button>
    </div>

    <input type="text" id="codeInput" class="go-input" maxlength="512"
      placeholder="code or url" autocomplete="off" autocapitalize="off"
      spellcheck="false" aria-label="Code" />
    <div class="go-error" id="goError"></div>

    <button type="button" class="go-btn" id="goBtn">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
      Go
    </button>

    <div class="go-footer">
      <a href="../index.html">Create a calendar</a> |
      <a href="../hub.html?create=1">Create a Hub</a>
    </div>
    <div class="go-account"><span id="accountBadge"></span></div>
  </div>

<script src="../passkey.js?v=20260927a"></script>
<script src="../account-core.js?v=20261009b"></script>
<script>
'use strict';

const codeInput = document.getElementById('codeInput');
const goBtn = document.getElementById('goBtn');
const goError = document.getElementById('goError');
let linkType = 'calendar';

document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    linkType = btn.dataset.type || 'calendar';
    codeInput.placeholder = 'code or url';
    goError.textContent = '';
    codeInput.classList.remove('error');
  });
});

function normalizeLinkInput(raw) {
  let str = (raw || '').trim();
  if (!str) return str;
  if (/^https?:\/\//i.test(str)) return str;
  if (/^[a-z0-9.-]+\.[a-z]{2,}([/?#]|$)/i.test(str)) return 'https://' + str;
  return str;
}

function extractCalendarToken(raw) {
  let str = normalizeLinkInput(raw);
  if (!str) return null;

  const tryUrl = str.includes('?c=') || str.includes('calendar.html')
    || str.includes('share.php') || /^https?:\/\//i.test(str);
  if (tryUrl) {
    try {
      const url = new URL(str, window.location.href);
      const token = url.searchParams.get('c');
      if (token) str = token.trim();
    } catch (e) {
      const match = str.match(/[?&]c=([A-Za-z0-9_-]+)/);
      if (match) str = match[1];
    }
  }

  if (/^[A-Za-z0-9_-]{6,64}$/.test(str)) return str;
  return null;
}

function extractHubToken(raw) {
  let str = normalizeLinkInput(raw);
  if (!str) return null;

  const tryUrl = str.includes('?g=') || str.includes('?hub=') || str.includes('hub.html')
    || /^https?:\/\//i.test(str);
  if (tryUrl) {
    try {
      const url = new URL(str, window.location.href);
      const token = url.searchParams.get('g') || url.searchParams.get('hub');
      if (token) str = token.trim();
    } catch (e) {
      let match = str.match(/[?&]g=([A-Za-z0-9_-]+)/);
      if (!match) match = str.match(/[?&]hub=([A-Za-z0-9_-]+)/);
      if (match) str = match[1];
    }
  }

  if (/^[A-Za-z0-9_-]{8,64}$/.test(str)) return str;
  return null;
}

function showGoError(message){
  goError.textContent = message;
  codeInput.classList.add('error');
  codeInput.focus();
}

async function go(){
  goError.textContent = '';
  codeInput.classList.remove('error');

  if(linkType === 'hub'){
    const token = extractHubToken(codeInput.value);
    if(!token){
      goError.textContent = 'Please enter a valid Hub code or link.';
      codeInput.classList.add('error');
      return;
    }
    window.location.href = '../hub.html?g=' + encodeURIComponent(token);
    return;
  }

  const token = extractCalendarToken(codeInput.value);
  if(!token){
    showGoError('Please enter a valid calendar code or link.');
    return;
  }

  goBtn.disabled = true;
  try {
    const url = new URL('../api.php', window.location.href);
    url.searchParams.set('action', 'calendar_meta');
    url.searchParams.set('c', token);
    const resp = await fetch(url.toString(), { credentials: 'same-origin' });
    const data = await resp.json();
    if(Account.handleApiError(data)) return;
    // ACCESS_REQUIRED: a real calendar with an emoji; the calendar page asks for it
    if(data.status !== 'success' && data.code !== 'ACCESS_REQUIRED'){
      showGoError('Please enter a valid calendar code or link.');
      return;
    }
    window.location.href = '../calendar.html?c=' + encodeURIComponent(token);
  } catch(e){
    showGoError('Please enter a valid calendar code or link.');
  } finally {
    goBtn.disabled = false;
  }
}

(function initFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const hubCode = params.get('hub');
  const calCode = params.get('c');
  if(hubCode){
    document.querySelector('[data-type="hub"]')?.click();
    codeInput.value = hubCode;
  } else if(calCode){
    document.querySelector('[data-type="calendar"]')?.click();
    codeInput.value = calCode;
  }
})();

goBtn.addEventListener('click', go);
codeInput.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
codeInput.addEventListener('input', () => {
  goError.textContent = '';
  codeInput.classList.remove('error');
});

document.addEventListener('DOMContentLoaded', async () => {
  const me = await Account.require();
  Account.renderBadge(me, document.getElementById('accountBadge'));
  codeInput.focus();
});
</script>
</body>
</html>
